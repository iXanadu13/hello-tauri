name: 'publish'

on:
  workflow_call:
    inputs:
      app_version:
        type: string
        description: The version of the app.
        required: true
      release_tag:
        type: string
        description: The tag to use for the release.
        required: true
      release_name:
        type: string
        description: The name of the release.
        required: true
      is_draft: # if true, `delete_release` will be ignored
        type: boolean
        description: Whether to save the release as a draft.
        required: false
        default: true
      prerelease:
        type: boolean
        description: Whether to make the release a prerelease.
        required: false
        default: false
      enable_sourcemap:
        type: boolean
        description: Whether to enable sourcemap in the build.
        required: false
        default: false
      # if not, artifacts will be uploaded to the old release (though you select `is_draft`)
      delete_release:
        type: boolean
        description: Whether to delete the release with the same tag.
        required: true
    secrets:
      BUILD_ENV:
        description: "Environment variables to pass to `tauri build`. Format: `key1=value1\\nkey2=value2\\n...`."
        required: false

jobs:
  cleanup-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Delete release
        if: ${{ inputs.delete_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ inputs.release_tag }} --yes --cleanup-tag || true
  publish-tauri:
    needs: [cleanup-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      #region Prepare env
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies (ubuntu-arm only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: 'npm' # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      #endregion

      #region Edit config
      - name: Set app version
        run: |
          node ./.github/scripts/set-version.mjs ${{ inputs.app_version }}
      - name: Enable Source Map
        if: ${{ inputs.enable_sourcemap }}
        run: |
          node ./.github/scripts/enable-sourcemap.mjs
      #endregion

      #region Build
      - name: Write BUILD_ENV to .env file
        if: matrix.variant != 'foss'
        run: |
          echo "${{ secrets.BUILD_ENV }}" > .env
      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: npm install # change this to npm or pnpm depending on which one you use.

      - uses: tauri-apps/tauri-action@v0 # see: https://github.com/tauri-apps/tauri-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: ${{ inputs.release_name }}
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: ${{ inputs.is_draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
      #endregion