name: "Release"
run-name: "v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "App version (x.y.z)"
        required: true
      prerelease:
        type: boolean
        description: "Is pre-release"
        required: false
        default: false
      enable_sourcemap:
        type: boolean
        description: Whether to enable sourcemap in the build.
        required: false
        default: false
      # delete_release:
      #   type: boolean
      #   description: "删除以前的release"
      #   required: false
      #   default: false

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      app_version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      enable_sourcemap: ${{ inputs.enable_sourcemap }}
    secrets:
      