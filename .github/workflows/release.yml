name: "release"
run-name: "v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "App version (x.y.z)"
        required: true
      release_tag:
        type: string
        description: "Release tag (default: <version>)"
        required: false
      release_name:
        type: string
        description: The name of the release.
        required: true
        default: "App v__VERSION__"
      prerelease:
        type: boolean
        description: "Is pre-release"
        required: false
        default: false
      enable_sourcemap:
        type: boolean
        description: "Enable sourcemap"
        required: false
        default: false
      # delete_release:
      #   type: boolean
      #   description: "删除以前的release"
      #   required: false
      #   default: false

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      app_version: ${{ inputs.version }}
      release_tag: ${{ inputs.release_tag != '' && inputs.release_tag || inputs.version }}
      release_name: ${{ inputs.release_name }}
      prerelease: ${{ inputs.prerelease }}
      enable_sourcemap: ${{ inputs.enable_sourcemap }}
    # secrets:
      